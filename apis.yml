name: TRDATA
description: >-
  TRDATA (TRDATA Technology Limited) is a real-time financial information and
  communication platform for professional traders, aggregating over-the-counter
  (OTC) quotes, prices, news, and analytics from market makers across fragmented
  fixed-income and emerging-market instruments. It covers Ukrainian, CEEMEA, and
  global bonds, currencies, commodities, and derivatives from local and
  international data providers, and bundles analytics tools such as a Bond
  Calculator, Bond Calendar, Swap Curves, real-time asset charts, and a TRDATA
  Excel add-in. More than 800 institutions -- including Societe Generale,
  UniCredit, Raiffeisen, BNP Paribas, Barclays, Deutsche Bank, and Commerzbank --
  use the platform to read and exchange market information. TRDATA is backed by
  500 Global. As of this profile the company publishes no public developer API,
  SDKs, or documentation surface; access is via registration and the hosted
  platform.
